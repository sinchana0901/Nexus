<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Sovereign AI Operating System</title>
    <meta name="description" content="NEXUS — A Two-Layer Hybrid AI Operating System with Voice Interface. Local-first, privacy-sovereign, real-time swarm execution.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ══════════════════════════════════════════════════════
           NEXUS Design System — Sci-Fi Dark Mode
           ══════════════════════════════════════════════════════ */

        :root {
            /* Core Palette */
            --nexus-black:       #030711;
            --nexus-surface:     #0a0f1e;
            --nexus-surface-2:   #111827;
            --nexus-border:      rgba(56, 189, 248, 0.12);
            --nexus-border-hover:rgba(56, 189, 248, 0.35);

            /* Accent Colors */
            --nexus-cyan:        #22d3ee;
            --nexus-blue:        #3b82f6;
            --nexus-indigo:      #6366f1;
            --nexus-sky:         #38bdf8;
            --nexus-emerald:     #34d399;
            --nexus-amber:       #fbbf24;
            --nexus-red:         #f87171;
            --nexus-violet:      #a78bfa;

            /* Glow Effects */
            --glow-cyan:         0 0 30px rgba(34, 211, 238, 0.25), 0 0 60px rgba(34, 211, 238, 0.1);
            --glow-red:          0 0 30px rgba(248, 113, 113, 0.4), 0 0 60px rgba(248, 113, 113, 0.15);
            --glow-emerald:      0 0 20px rgba(52, 211, 153, 0.3);

            /* Typography */
            --font-mono:   'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
            --font-display:'Outfit', 'Inter', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            background: var(--nexus-black);
            color: rgba(56, 189, 248, 0.85);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Background ────────────────────────────── */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            animation: gridPulse 8s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }

        .bg-radial {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 80%, rgba(34, 211, 238, 0.05) 0%, transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--nexus-cyan);
            border-radius: 50%;
            opacity: 0;
            z-index: 0;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0%   { opacity: 0; transform: translateY(100vh) scale(0); }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-10vh) scale(1); }
        }

        /* ── Main Layout ────────────────────────────────────── */
        .nexus-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            gap: 2rem;
        }

        /* ── Header ─────────────────────────────────────────── */
        .nexus-header {
            text-align: center;
            user-select: none;
        }

        .nexus-logo {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 4rem;
            letter-spacing: 0.45em;
            padding-right: -0.45em;
            background: linear-gradient(135deg, var(--nexus-cyan) 0%, var(--nexus-blue) 40%, var(--nexus-indigo) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 25px rgba(34, 211, 238, 0.3));
            position: relative;
        }

        .nexus-logo::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--nexus-cyan), var(--nexus-blue), transparent);
            opacity: 0.5;
        }

        .nexus-subtitle {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            color: rgba(56, 189, 248, 0.35);
            margin-top: 0.75rem;
            text-transform: uppercase;
        }

        /* ── System Status Bar ──────────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid var(--nexus-border);
            border-radius: 99px;
            backdrop-filter: blur(12px);
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(56, 189, 248, 0.5);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--nexus-emerald);
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
            animation: statusPulse 2s ease-in-out infinite;
        }

        .status-dot.offline {
            background: var(--nexus-red);
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.5);
            animation: none;
        }

        .status-dot.processing {
            background: var(--nexus-amber);
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
            animation: statusPulse 0.5s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.5; transform: scale(0.8); }
        }

        /* ── Microphone Button ──────────────────────────────── */
        .mic-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Orbital ring */
        .mic-orbit {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid rgba(34, 211, 238, 0.08);
            border-radius: 50%;
            animation: orbitSpin 20s linear infinite;
        }

        .mic-orbit::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            width: 6px;
            height: 6px;
            background: var(--nexus-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--nexus-cyan);
        }

        .mic-orbit-2 {
            width: 210px;
            height: 210px;
            border-color: rgba(99, 102, 241, 0.06);
            animation-direction: reverse;
            animation-duration: 30s;
        }

        .mic-orbit-2::before {
            background: var(--nexus-indigo);
            box-shadow: 0 0 10px var(--nexus-indigo);
        }

        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .mic-btn {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid rgba(34, 211, 238, 0.2);
            background: radial-gradient(circle at 40% 35%, rgba(34, 211, 238, 0.08) 0%, rgba(10, 15, 30, 0.9) 70%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            z-index: 2;
        }

        .mic-btn:hover {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: var(--glow-cyan);
            transform: scale(1.05);
            background: radial-gradient(circle at 40% 35%, rgba(34, 211, 238, 0.15) 0%, rgba(10, 15, 30, 0.9) 70%);
        }

        .mic-btn svg {
            width: 42px;
            height: 42px;
            color: rgba(34, 211, 238, 0.6);
            transition: all 0.3s ease;
        }

        .mic-btn:hover svg {
            color: rgba(34, 211, 238, 0.9);
            filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.5));
        }

        /* ── Active / Listening State ───────────────────────── */
        .mic-btn.listening {
            border-color: rgba(248, 113, 113, 0.7);
            background: radial-gradient(circle at 50% 50%, rgba(248, 113, 113, 0.15) 0%, rgba(10, 15, 30, 0.95) 70%);
            box-shadow: var(--glow-red);
            animation: micPulse 1.5s ease-in-out infinite;
        }

        .mic-btn.listening svg {
            color: var(--nexus-red);
            filter: drop-shadow(0 0 12px rgba(248, 113, 113, 0.6));
        }

        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(248, 113, 113, 0.3), 0 0 40px rgba(248, 113, 113, 0.1); transform: scale(1); }
            50%      { box-shadow: 0 0 35px rgba(248, 113, 113, 0.5), 0 0 70px rgba(248, 113, 113, 0.2); transform: scale(1.03); }
        }

        .mic-btn.processing {
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.2);
            pointer-events: none;
        }

        .mic-btn.processing svg {
            color: var(--nexus-amber);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Mic Status Label */
        .mic-label {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(56, 189, 248, 0.4);
            margin-top: 1.2rem;
            text-align: center;
            font-weight: 500;
            min-height: 1.2em;
            transition: all 0.3s ease;
        }

        .mic-label.active {
            color: var(--nexus-red);
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.4);
        }

        .mic-label.processing {
            color: var(--nexus-amber);
        }

        /* ── Terminal Panel ─────────────────────────────────── */
        .terminal-panel {
            width: 100%;
            max-width: 800px;
            background: rgba(10, 15, 30, 0.65);
            border: 1px solid var(--nexus-border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(56, 189, 248, 0.05);
            transition: border-color 0.3s ease;
        }

        .terminal-panel:hover {
            border-color: var(--nexus-border-hover);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--nexus-border);
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(56, 189, 248, 0.5);
        }

        .terminal-title-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: var(--nexus-cyan);
            opacity: 0.6;
            animation: termBlink 3s ease-in-out infinite;
        }

        @keyframes termBlink {
            0%, 100% { opacity: 0.6; }
            50%      { opacity: 0.2; }
        }

        .terminal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .terminal-action-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0.4;
        }

        .terminal-action-dot:nth-child(1) { background: #f87171; }
        .terminal-action-dot:nth-child(2) { background: #fbbf24; }
        .terminal-action-dot:nth-child(3) { background: #34d399; }

        /* Terminal Feed */
        .terminal-feed {
            height: 300px;
            overflow-y: auto;
            padding: 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .terminal-feed::-webkit-scrollbar { width: 4px; }
        .terminal-feed::-webkit-scrollbar-track { background: transparent; }
        .terminal-feed::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.15);
            border-radius: 4px;
        }
        .terminal-feed::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.3);
        }

        /* ── Terminal Log Entries ────────────────────────────── */
        .log-entry {
            font-size: 0.78rem;
            line-height: 1.5;
            animation: logFadeIn 0.3s ease-out;
            padding: 0.15rem 0;
        }

        @keyframes logFadeIn {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .log-system   { color: rgba(56, 189, 248, 0.35); }
        .log-user     { color: rgba(226, 232, 240, 0.9); }
        .log-routing  { color: rgba(56, 189, 248, 0.45); font-size: 0.7rem; }
        .log-narrative{ color: var(--nexus-cyan); }
        .log-alert    { color: var(--nexus-amber); font-weight: 600; }
        .log-error    { color: var(--nexus-red); font-weight: 500; }
        .log-exec     { color: var(--nexus-emerald); font-weight: 600; }

        /* Task Card */
        .task-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.85rem;
            margin: 0.25rem 0;
            background: rgba(34, 211, 238, 0.04);
            border: 1px solid rgba(34, 211, 238, 0.1);
            border-left: 3px solid var(--nexus-cyan);
            border-radius: 8px;
            animation: taskSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.72rem;
        }

        @keyframes taskSlideIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .task-card.dispatched {
            border-left-color: var(--nexus-emerald);
            background: rgba(52, 211, 153, 0.04);
            border-color: rgba(52, 211, 153, 0.1);
        }

        .task-card.dispatched .task-status {
            color: var(--nexus-emerald);
        }

        .task-icon {
            font-size: 1.1rem;
            min-width: 24px;
            text-align: center;
        }

        .task-info {
            flex: 1;
        }

        .task-node {
            font-weight: 600;
            color: rgba(226, 232, 240, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .task-action {
            color: rgba(56, 189, 248, 0.5);
            font-size: 0.65rem;
        }

        .task-status {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--nexus-amber);
            font-weight: 600;
        }

        /* Approval Buttons */
        .approval-row {
            display: flex;
            gap: 0.75rem;
            margin: 0.4rem 0;
            animation: logFadeIn 0.4s ease-out;
        }

        .approval-btn {
            padding: 0.45rem 1.5rem;
            border-radius: 8px;
            border: 1px solid;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .approval-btn.approve {
            background: rgba(52, 211, 153, 0.1);
            border-color: rgba(52, 211, 153, 0.3);
            color: var(--nexus-emerald);
        }

        .approval-btn.approve:hover {
            background: rgba(52, 211, 153, 0.2);
            box-shadow: var(--glow-emerald);
        }

        .approval-btn.deny {
            background: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.3);
            color: var(--nexus-red);
        }

        .approval-btn.deny:hover {
            background: rgba(248, 113, 113, 0.2);
            box-shadow: var(--glow-red);
        }

        /* ── Routing Metadata Badge ─────────────────────────── */
        .routing-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: 0.25rem;
        }

        .routing-badge.local {
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.25);
            color: var(--nexus-violet);
        }

        .routing-badge.cloud {
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.25);
            color: var(--nexus-cyan);
        }

        .routing-badge.cache {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.25);
            color: var(--nexus-amber);
        }

        /* ── Latency Tag ────────────────────────────────────── */
        .latency-tag {
            font-size: 0.58rem;
            color: rgba(56, 189, 248, 0.3);
            font-weight: 300;
        }

        /* ── Responsive ─────────────────────────────────────── */
        @media (max-width: 640px) {
            .nexus-logo { font-size: 2.5rem; }
            .terminal-feed { height: 250px; }
            .mic-btn { width: 100px; height: 100px; }
            .mic-btn svg { width: 32px; height: 32px; }
            .mic-orbit { width: 140px; height: 140px; }
            .mic-orbit-2 { width: 165px; height: 165px; }
            .status-bar { gap: 0.75rem; padding: 0.4rem 1rem; font-size: 0.55rem; }
        }

        /* ── Telemetry Panel ─────────────────────────────────── */
        .telemetry-panel {
            width: 100%;
            max-width: 800px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 0.5rem 1.25rem;
            background: rgba(10, 15, 30, 0.5);
            border: 1px solid var(--nexus-border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(56, 189, 248, 0.5);
            animation: logFadeIn 0.3s ease-out;
            flex-wrap: wrap;
        }

        .telemetry-panel.visible {
            display: flex;
        }

        .telemetry-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .telemetry-label {
            color: rgba(56, 189, 248, 0.35);
        }

        .telemetry-value {
            font-weight: 600;
        }

        .telemetry-value.ollama {
            color: var(--nexus-violet);
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.3);
        }

        .telemetry-value.groq {
            color: var(--nexus-cyan);
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.3);
        }

        .telemetry-value.cache {
            color: var(--nexus-amber);
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }

        /* Privacy Badge */
        .privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.55rem;
            font-weight: 600;
        }

        .privacy-badge.local {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            color: var(--nexus-emerald);
        }

        .privacy-badge.masked {
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.25);
            color: var(--nexus-violet);
        }

        /* ── Scanline overlay (subtle CRT effect) ───────────── */
        .scanline-overlay {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <!-- Background Layers -->
    <div class="bg-grid"></div>
    <div class="bg-radial"></div>
    <div class="scanline-overlay"></div>

    <!-- Floating Particles (generated via JS) -->
    <div id="particles"></div>

    <!-- ═══ Main Interface ════════════════════════════════ -->
    <div class="nexus-container">

        <!-- Header -->
        <header class="nexus-header">
            <h1 class="nexus-logo">NEXUS</h1>
            <p class="nexus-subtitle">Sovereign AI Operating System — Samsung PRISM</p>
        </header>

        <!-- System Status Bar -->
        <div class="status-bar" id="statusBar">
            <div class="status-indicator">
                <div class="status-dot" id="brainDot"></div>
                <span>BRAIN:3001</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="handsDot"></div>
                <span>HANDS:3002</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="voiceDot"></div>
                <span>VOICE:3000</span>
            </div>
            <span id="latencyDisplay" class="latency-tag"></span>
        </div>

        <!-- Microphone Control -->
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="mic-container">
                <div class="mic-orbit"></div>
                <div class="mic-orbit mic-orbit-2"></div>
                <button id="micBtn" class="mic-btn" aria-label="Toggle Microphone">
                    <svg id="micIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                    </svg>
                </button>
            </div>
            <div id="micLabel" class="mic-label">CLICK TO SPEAK</div>
        </div>

        <!-- Terminal Panel -->
        <div class="terminal-panel">
            <div class="terminal-header">
                <div class="terminal-title">
                    <div class="terminal-title-dot"></div>
                    <span>Terminal Feed</span>
                </div>
                <div class="terminal-actions">
                    <div class="terminal-action-dot"></div>
                    <div class="terminal-action-dot"></div>
                    <div class="terminal-action-dot"></div>
                </div>
            </div>
            <div id="terminalFeed" class="terminal-feed">
                <div class="log-entry log-system">&gt; NEXUS Operating System v2.0 initialized.</div>
                <div class="log-entry log-system">&gt; Three-layer hybrid architecture online.</div>
                <div class="log-entry log-system">&gt; Awaiting voice input...</div>
            </div>
        </div>

        <!-- Sentinel Telemetry Panel (populated by JS) -->
        <div class="telemetry-panel" id="telemetryPanel">
            <div class="telemetry-item">
                <span class="telemetry-label">Inference:</span>
                <span class="telemetry-value" id="telInference">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Intent:</span>
                <span class="telemetry-value" id="telIntent">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Privacy:</span>
                <span id="telPrivacy">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Sentinel:</span>
                <span class="telemetry-value" id="telSentinelMs">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Executor:</span>
                <span class="telemetry-value" id="telExecutorMs">—</span>
            </div>
            <div class="telemetry-item">
                <span class="telemetry-label">Total:</span>
                <span class="telemetry-value" id="telTotalMs">—</span>
            </div>
        </div>

    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
